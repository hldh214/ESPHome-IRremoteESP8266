esphome:
  name: fujitsu
  friendly_name: fujitsu

external_components:
  - source: components

esp32:
  board: esp32-c3-devkitm-1

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

climate:
  - platform: fujitsu_264
    name: "Fujitsu AC"
    id: my_climate

button:
  - platform: template
    name: 'Toggle powerful'
    on_press:
      then:
        - lambda: |-
            id(my_climate).toggle_powerful();

  - platform: template
    name: 'Set fan angle'
    on_press:
      then:
        - lambda: |-
            // Acceptable values are 1-7 and 15(means stay)
            id(my_climate).set_fan_angle(1);
